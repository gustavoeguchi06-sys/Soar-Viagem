# Nginx da Soar: /etc/nginx/sites-available/soar  (link em sites-enabled)
#
# Troque operadorasoar.com.br pelo domínio certo, se for outro. O bloco HTTPS
# (listen 443) é completado pelo Certbot: rode
#   sudo certbot --nginx -d operadorasoar.com.br -d www.operadorasoar.com.br
# depois de apontar o DNS para o VPS. Ele cria o certificado, coloca as linhas
# ssl_* e já deixa a renovação automática ligada (systemctl list-timers).

# Limite de pedidos por IP no login e no "Saiba mais" (o Django também limita;
# isto segura antes de chegar nele).
limit_req_zone $binary_remote_addr zone=soar_formularios:10m rate=10r/m;

# http://... -> https://  (e sem www -> com www não: o domínio principal é o sem www)
server {
    listen 80;
    listen [::]:80;
    server_name operadorasoar.com.br www.operadorasoar.com.br;
    return 301 https://operadorasoar.com.br$request_uri;
}

# https://www... -> https://operadorasoar.com.br
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.operadorasoar.com.br;
    # (linhas ssl_certificate do Certbot entram aqui)
    return 301 https://operadorasoar.com.br$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name operadorasoar.com.br;
    # (linhas ssl_certificate do Certbot entram aqui)

    # Teto de envio: igual ao SOAR_TAMANHO_MAXIMO_ENVIO_MB do .env (10 MB)...
    client_max_body_size 10M;

    # Cabeçalhos de segurança. O Django já manda CSP, HSTS, nosniff e
    # X-Frame-Options; estes cobrem também os arquivos que o Nginx serve sozinho.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    server_tokens off;

    access_log /var/log/nginx/soar-acesso.log;
    error_log  /var/log/nginx/soar-erro.log;

    # CSS, JS, fontes e ícones (python manage.py collectstatic)
    location /static/ {
        alias /srv/soar/app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Fotos e vídeos enviados, quando NÃO se usa o R2 (com R2 eles saem do
    # domínio do bucket e este bloco fica sem uso).
    location /media/ {
        alias /srv/soar/app/media/;
        expires 30d;
        add_header X-Content-Type-Options "nosniff" always;
        # Nada enviado é executado nem vira página: só imagem e vídeo.
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; sandbox" always;
        location ~* \.(php|py|pl|sh|cgi|html?|svg|js)$ { deny all; }
    }

    # ...e só o painel (equipe logada, conferido também no Django) manda vídeo.
    location /painel/ {
        client_max_body_size 105M;
        include /srv/soar/app/deploy/nginx-proxy.conf;
    }

    location ~ ^/(entrar|b2b/cadastro|senha|destinos/[^/]+/saiba-mais)/ {
        limit_req zone=soar_formularios burst=10 nodelay;
        include /srv/soar/app/deploy/nginx-proxy.conf;
    }

    location / {
        include /srv/soar/app/deploy/nginx-proxy.conf;
    }

    # Gunicorn fora do ar: página simples em vez do erro cru do Nginx.
    error_page 502 503 504 /static/manutencao.html;
}
