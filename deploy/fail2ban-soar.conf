# /etc/fail2ban/jail.d/soar.conf
# Bloqueia por 1 hora o IP que errar o SSH ou estourar o limite do Nginx várias
# vezes. O site já limita tentativas de login; isto barra o IP antes.
#
# Ubuntu 26.04: o SSH não grava mais em /var/log/auth.log, só no journal do
# systemd; por isso o sshd lê do journal (pacote python3-systemd). O Nginx
# continua em arquivo, então aquele lê do arquivo.
[sshd]
enabled  = true
backend  = systemd
maxretry = 5
findtime = 10m
bantime  = 1h

[nginx-limit-req]
enabled  = true
backend  = auto
logpath  = /var/log/nginx/soar-erro.log
maxretry = 10
findtime = 10m
bantime  = 1h
